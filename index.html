<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Configurações para parecer uma App Nativa no Telemóvel -->
    <title>Mealheiro da Kelia</title>
    <meta name="theme-color" content="#8B5CF6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mealheiro">
    
    <!-- Ícones da App (iOS e Android) -->
    <link rel="apple-touch-icon" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1fa99/512.png">
    <link rel="icon" type="image/png" href="https://fonts.gstatic.com/s/e/notoemoji/latest/1fa99/512.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #8B5CF6; 
            background-image: radial-gradient(#A78BFA 2px, transparent 2px);
            background-size: 20px 20px;
            overscroll-behavior-y: none;
        }
        .cartoon-box {
            background-color: white;
            border: 4px solid #1F2937;
            border-radius: 24px;
            box-shadow: 8px 8px 0px #1F2937;
        }
        .cartoon-btn {
            border: 3px solid #1F2937;
            box-shadow: 4px 4px 0px #1F2937;
            transition: all 0.1s ease-in-out;
        }
        .cartoon-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #1F2937;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .admin-only { display: none; }
        .is-admin .admin-only { display: flex; } 
        .is-admin .admin-only-grid { display: grid; }
        .is-admin .admin-only-block { display: block; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- ECRÃ DE LOGIN -->
    <div id="ecra-login" class="fixed inset-0 bg-purple-600 z-[100] flex items-center justify-center p-4">
        <div class="cartoon-box w-full max-w-sm p-6 text-center bg-white">
            <h2 class="text-3xl font-bold mb-6 text-gray-800">Quem és tu?</h2>
            
            <div class="grid gap-4">
                <!-- Botão Kelia -->
                <button onclick="entrarComo('kelia')" class="cartoon-btn bg-yellow-300 p-4 rounded-xl flex items-center gap-4">
                    <img id="login-avatar-kelia" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Kelia&backgroundColor=ffdfbf" class="w-14 h-14 bg-white rounded-full border-3 border-gray-800">
                    <div class="text-left">
                        <p class="font-bold text-2xl text-gray-800">Kelia</p>
                        <p class="text-sm text-gray-700 font-medium">Apenas ver saldo</p>
                    </div>
                </button>

                <!-- Botão Marlene -->
                <button onclick="pedirSenhaAdmin()" class="cartoon-btn bg-pink-300 p-4 rounded-xl flex items-center gap-4">
                    <img id="login-avatar-marlene" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Marlene&backgroundColor=ffb6c1" class="w-14 h-14 bg-white rounded-full border-3 border-gray-800">
                    <div class="text-left">
                        <p class="font-bold text-2xl text-gray-800">Marlene</p>
                        <p class="text-sm text-gray-700 font-medium">Administradora</p>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL: Senha da Marlene -->
    <div id="modal-senha" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[110]">
        <div class="cartoon-box w-full max-w-sm p-6 bg-pink-100 text-center">
            <h2 class="text-2xl font-bold mb-4">Senha de Acesso</h2>
            <input type="password" id="input-senha" class="w-full border-3 border-gray-800 rounded-xl p-3 text-center text-2xl font-bold mb-4" placeholder="••••">
            <div class="flex gap-3">
                <button onclick="fecharModal('modal-senha')" class="cartoon-btn flex-1 bg-gray-300 font-bold py-2 rounded-xl">Voltar</button>
                <button onclick="verificarSenha()" class="cartoon-btn flex-1 bg-green-400 font-bold py-2 rounded-xl">Entrar</button>
            </div>
        </div>
    </div>

    <!-- ECRÃ PRINCIPAL DA APP -->
    <div id="app-principal" class="cartoon-box w-full max-w-md p-6 relative flex flex-col h-[90vh] max-h-[800px] hidden">
        
        <!-- Botão Sair -->
        <button onclick="fazerLogout()" class="absolute top-4 left-4 cartoon-btn bg-red-400 text-white font-bold px-3 py-2 rounded-xl text-sm flex items-center gap-1">
            ⬅️ Sair
        </button>

        <!-- Botão Configurações (Apenas Admin) -->
        <button onclick="abrirModal('modal-config')" class="admin-only absolute top-4 right-4 text-2xl cartoon-btn bg-gray-100 w-12 h-12 rounded-full items-center justify-center">
            ⚙️
        </button>

        <!-- Cabeçalho / Perfil -->
        <div class="text-center mt-12">
            <div class="relative inline-block">
                <img id="avatar-img" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=Kelia&backgroundColor=ffdfbf" 
                     alt="Avatar" class="w-24 h-24 bg-yellow-200 border-4 border-gray-800 rounded-full object-cover">
                
                <!-- Botão de alterar o Emoji -->
                <button onclick="trocarAvatar()" class="absolute bottom-0 -right-2 bg-white border-2 border-gray-800 rounded-full w-8 h-8 flex items-center justify-center text-sm shadow-[2px_2px_0px_#1F2937] hover:translate-y-px hover:shadow-[1px_1px_0px_#1F2937] transition-all">
                    🎲
                </button>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mt-3" id="nome-perfil">Olá, Kelia!</h1>
        </div>

        <!-- Cartão de Saldo -->
        <div class="bg-yellow-300 border-4 border-gray-800 rounded-2xl p-4 text-center my-4 transform rotate-1">
            <p class="text-gray-700 font-bold uppercase tracking-wider text-sm mb-1">A Tua Mesada</p>
            <p class="text-4xl font-bold text-gray-900" id="saldo-display">A carregar...</p>
        </div>

        <!-- Botões de Ação Rápida (Apenas Admin) -->
        <div class="admin-only admin-only-grid grid-cols-2 gap-3 mb-6">
            <button onclick="abrirModal('modal-acao'); document.getElementById('tipo-acao').value = 'bonus'" class="cartoon-btn bg-green-400 text-gray-900 font-bold py-3 px-2 rounded-xl text-sm flex flex-col items-center">
                <span class="text-2xl mb-1">🌟</span> Boa Ação (+)
            </button>
            <button onclick="adicionarRegisto('Castigo Leve', -100, 'saida')" class="cartoon-btn bg-orange-400 text-gray-900 font-bold py-3 px-2 rounded-xl text-sm flex flex-col items-center">
                <span class="text-2xl mb-1">😕</span> Castigo (-100)
            </button>
            <button onclick="adicionarRegisto('Castigo Forte', -200, 'saida')" class="cartoon-btn bg-red-400 text-white font-bold py-3 px-2 rounded-xl text-sm flex flex-col items-center">
                <span class="text-2xl mb-1">🚫</span> Castigo (-200)
            </button>
            <button onclick="abrirModal('modal-acao'); document.getElementById('tipo-acao').value = 'gasto'" class="cartoon-btn bg-blue-400 text-white font-bold py-3 px-2 rounded-xl text-sm flex flex-col items-center">
                <span class="text-2xl mb-1">🛍️</span> Gasto (-)
            </button>
        </div>

        <!-- Histórico -->
        <div class="flex-1 overflow-y-auto no-scrollbar border-t-4 border-dashed border-gray-300 pt-4 pb-20">
            <h3 class="font-bold text-gray-500 mb-3 text-center uppercase">Últimos Movimentos</h3>
            <ul id="lista-historico" class="space-y-3">
                <!-- Preenchido via JS -->
            </ul>
        </div>

        <!-- Botão Fechar Mês (Apenas Admin) -->
        <div class="admin-only admin-only-flex absolute bottom-0 left-0 w-full p-4 bg-white border-t-4 border-gray-800 rounded-b-xl">
            <button onclick="fecharMes()" class="cartoon-btn w-full bg-purple-500 text-white text-lg font-bold py-3 rounded-xl flex items-center justify-center gap-2">
                <span>📅</span> Fechar Contas (Repor Mesada)
            </button>
        </div>
    </div>

    <!-- MODAL: Configurações -->
    <div id="modal-config" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="cartoon-box w-full max-w-sm p-6 bg-pink-100">
            <h2 class="text-2xl font-bold mb-4 flex items-center gap-2">⚙️ Configurações</h2>
            <div class="space-y-4">
                <div>
                    <label class="font-bold text-gray-700">Nome da Criança</label>
                    <input type="text" id="config-nome" class="w-full border-3 border-gray-800 rounded-xl p-2 font-bold mt-1" value="Kelia">
                </div>
                <div>
                    <label class="font-bold text-gray-700">Mesada Mensal Fixa (Kz)</label>
                    <input type="number" id="config-valor" class="w-full border-3 border-gray-800 rounded-xl p-2 font-bold mt-1" value="5000">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="fecharModal('modal-config')" class="cartoon-btn flex-1 bg-gray-300 font-bold py-2 rounded-xl">Cancelar</button>
                <button onclick="guardarConfiguracoes()" class="cartoon-btn flex-1 bg-green-400 font-bold py-2 rounded-xl">Guardar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: Ação Personalizada -->
    <div id="modal-acao" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="cartoon-box w-full max-w-sm p-6 bg-blue-100">
            <h2 class="text-2xl font-bold mb-4" id="titulo-modal-acao">Adicionar Movimento</h2>
            <input type="hidden" id="tipo-acao">
            <div class="space-y-4">
                <div>
                    <label class="font-bold text-gray-700">O que aconteceu?</label>
                    <input type="text" id="acao-descricao" class="w-full border-3 border-gray-800 rounded-xl p-2 font-bold mt-1" placeholder="Ex: Arrumou o quarto">
                </div>
                <div>
                    <label class="font-bold text-gray-700">Valor (Kz)</label>
                    <input type="number" id="acao-valor" class="w-full border-3 border-gray-800 rounded-xl p-2 font-bold mt-1" placeholder="500">
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="fecharModal('modal-acao')" class="cartoon-btn flex-1 bg-gray-300 font-bold py-2 rounded-xl">Cancelar</button>
                <button onclick="confirmarAcaoPersonalizada()" class="cartoon-btn flex-1 bg-blue-500 text-white font-bold py-2 rounded-xl">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy, serverTimestamp, setDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAGAyM_i2Kr6ynTzuxo2chuA-IAqn6nt4",
            authDomain: "mesada-ad721.firebaseapp.com",
            projectId: "mesada-ad721",
            storageBucket: "mesada-ad721.firebasestorage.app",
            messagingSenderId: "18131834166",
            appId: "1:18131834166:web:2928cb8ee30651c9a70f97",
            measurementId: "G-5ZZBQC31S3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const transacoesRef = collection(db, "mesada_transacoes");
        const configRef = doc(db, "mesada_config", "geral");

        let configuracaoAtual = { nome: "Kelia", valorBase: 5000, foto: "", fotoAdmin: "" };
        let transacoesGlobais = [];
        
        // =============== SISTEMA DE LOGIN ===============
        const SENHA_MARLENE = "1234"; // A senha da Mamã continua a ser 1234
        let utilizadorAtual = null;

        window.pedirSenhaAdmin = () => {
            document.getElementById('input-senha').value = '';
            abrirModal('modal-senha');
        };

        window.verificarSenha = () => {
            const digitado = document.getElementById('input-senha').value;
            if (digitado === SENHA_MARLENE) {
                fecharModal('modal-senha');
                entrarComo('admin');
            } else {
                alert("Senha incorreta!");
            }
        };

        window.entrarComo = (role) => {
            utilizadorAtual = role;
            localStorage.setItem('sessao_mesada', role); 
            document.getElementById('ecra-login').classList.add('hidden');
            document.getElementById('app-principal').classList.remove('hidden');

            if (role === 'admin') {
                document.getElementById('app-principal').classList.add('is-admin');
            } else {
                document.getElementById('app-principal').classList.remove('is-admin');
            }
            renderizarPerfil();
            renderizarLista();
        };

        window.fazerLogout = () => {
            utilizadorAtual = null;
            localStorage.removeItem('sessao_mesada');
            document.getElementById('ecra-login').classList.remove('hidden');
            document.getElementById('app-principal').classList.add('hidden');
            document.getElementById('app-principal').classList.remove('is-admin');
        };

        const sessaoGuardada = localStorage.getItem('sessao_mesada');
        if (sessaoGuardada) {
            entrarComo(sessaoGuardada);
        }
        // ================================================

        // === ATUALIZAR OS ECRÃS DE LOGIN E INTERIOR ===
        function atualizarAvataresLogin() {
            const avatarKeliaLogin = configuracaoAtual.foto || `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${configuracaoAtual.nome}&backgroundColor=ffdfbf`;
            const avatarMarleneLogin = configuracaoAtual.fotoAdmin || `https://api.dicebear.com/7.x/fun-emoji/svg?seed=Marlene&backgroundColor=ffb6c1`;
            
            document.getElementById('login-avatar-kelia').src = avatarKeliaLogin;
            document.getElementById('login-avatar-marlene').src = avatarMarleneLogin;
        }

        function renderizarPerfil() {
            if (!configuracaoAtual || !utilizadorAtual) return;
            
            const avatarImg = document.getElementById('avatar-img');
            const nomePerfil = document.getElementById('nome-perfil');
            
            const avatarKeliaLogin = configuracaoAtual.foto || `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${configuracaoAtual.nome}&backgroundColor=ffdfbf`;
            const avatarMarleneLogin = configuracaoAtual.fotoAdmin || `https://api.dicebear.com/7.x/fun-emoji/svg?seed=Marlene&backgroundColor=ffb6c1`;

            if (utilizadorAtual === 'admin') {
                nomePerfil.textContent = "Olá, Mamã!";
                avatarImg.src = avatarMarleneLogin;
            } else if (utilizadorAtual === 'kelia') {
                nomePerfil.textContent = `Olá, ${configuracaoAtual.nome}!`;
                avatarImg.src = avatarKeliaLogin;
            }
        }

        // === TROCAR AVATAR NO FIREBASE ===
        window.trocarAvatar = async () => {
            const seedAleatoria = Math.random().toString(36).substring(2, 8);
            
            if (utilizadorAtual === 'admin') {
                const novaUrl = `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${seedAleatoria}&backgroundColor=ffb6c1`;
                await setDoc(configRef, { fotoAdmin: novaUrl }, { merge: true });
            } else {
                const novaUrl = `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${seedAleatoria}&backgroundColor=ffdfbf`;
                await setDoc(configRef, { foto: novaUrl }, { merge: true });
            }
        };

        window.abrirModal = (id) => {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
        };

        window.fecharModal = (id) => {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        };

        window.formatarKz = (valor) => {
            return valor.toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz';
        };

        // ESCUTA A BASE DE DADOS EM TEMPO REAL
        onSnapshot(configRef, (docSnap) => {
            if (docSnap.exists()) {
                configuracaoAtual = { ...configuracaoAtual, ...docSnap.data() };
                document.getElementById('config-nome').value = configuracaoAtual.nome;
                document.getElementById('config-valor').value = configuracaoAtual.valorBase;
                
                // Atualiza o ecrã de login imediatamente!
                atualizarAvataresLogin();
                // Atualiza o interior (se já estiver alguém logado)
                renderizarPerfil(); 
            }
        });

        window.guardarConfiguracoes = async () => {
            const nome = document.getElementById('config-nome').value || "Kelia";
            const valorBase = parseFloat(document.getElementById('config-valor').value) || 5000;
            await setDoc(configRef, { nome, valorBase }, { merge: true });
            fecharModal('modal-config');
        };

        const q = query(transacoesRef, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            transacoesGlobais = [];
            snapshot.forEach((doc) => {
                transacoesGlobais.push({ id: doc.id, ...doc.data() });
            });
            renderizarLista();
        });

        function renderizarLista() {
            const lista = document.getElementById('lista-historico');
            lista.innerHTML = '';
            
            let saldo = configuracaoAtual.valorBase;

            if (transacoesGlobais.length === 0) {
                lista.innerHTML = '<p class="text-center text-gray-400 font-bold mt-4">Nenhum movimento este mês!</p>';
                document.getElementById('saldo-display').textContent = window.formatarKz(saldo);
                return;
            }

            transacoesGlobais.forEach(t => {
                const isEntrada = t.tipo === 'entrada';
                saldo += isEntrada ? t.valor : -t.valor;

                const icone = t.descricao.includes('Castigo') ? '💔' : (isEntrada ? '⭐' : '🛍️');
                const corCard = isEntrada ? 'bg-green-100 border-green-500' : 'bg-red-100 border-red-500';
                const corTexto = isEntrada ? 'text-green-700' : 'text-red-700';
                const sinal = isEntrada ? '+' : '-';

                const btnApagar = utilizadorAtual === 'admin' 
                    ? `<button onclick="apagarRegisto('${t.id}')" class="text-xs text-gray-500 underline mt-1 hover:text-red-500">Apagar</button>`
                    : ``;

                const li = document.createElement('li');
                li.className = `flex justify-between items-center p-3 rounded-xl border-2 ${corCard}`;
                li.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-2xl">${icone}</span>
                        <p class="font-bold text-gray-800 text-sm leading-tight">${t.descricao}</p>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="font-bold ${corTexto}">${sinal} ${window.formatarKz(t.valor)}</span>
                        ${btnApagar}
                    </div>
                `;
                lista.appendChild(li);
            });

            document.getElementById('saldo-display').textContent = window.formatarKz(saldo);
        }

        window.adicionarRegisto = async (descricao, valorNum, tipo) => {
            if (utilizadorAtual !== 'admin') return;
            const valorPositivo = Math.abs(valorNum);
            await addDoc(transacoesRef, {
                descricao: descricao,
                valor: valorPositivo,
                tipo: tipo,
                timestamp: serverTimestamp()
            });
        };

        window.confirmarAcaoPersonalizada = async () => {
            if (utilizadorAtual !== 'admin') return;
            const tipoAcao = document.getElementById('tipo-acao').value; 
            const descricao = document.getElementById('acao-descricao').value;
            const valor = parseFloat(document.getElementById('acao-valor').value);

            if(!descricao || !valor || valor <= 0) {
                alert("Preenche a descrição e um valor válido!");
                return;
            }

            const tipo = tipoAcao === 'bonus' ? 'entrada' : 'saida';
            const descFinal = tipoAcao === 'bonus' ? `Boa Ação: ${descricao}` : `Gasto: ${descricao}`;

            await addDoc(transacoesRef, {
                descricao: descFinal,
                valor: valor,
                tipo: tipo,
                timestamp: serverTimestamp()
            });
            fecharModal('modal-acao');
        };

        window.apagarRegisto = async (id) => {
            if (utilizadorAtual !== 'admin') return;
            if(confirm("Apagar este movimento?")) {
                await deleteDoc(doc(db, "mesada_transacoes", id));
            }
        };

        window.fecharMes = async () => {
            if (utilizadorAtual !== 'admin') return;
            if(confirm("Isto vai limpar os castigos e boas ações do mês atual e repor a base de 5000 Kz. Tens a certeza?")) {
                const batch = writeBatch(db);
                transacoesGlobais.forEach(t => {
                    const docRef = doc(db, "mesada_transacoes", t.id);
                    batch.delete(docRef);
                });
                await batch.commit();
            }
        };
    </script>
</body>
</html>
